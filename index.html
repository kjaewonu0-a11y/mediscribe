/* Layout: 첫 화면에 'QR 찍기'를 크게 두고, 아래에 검색·분야 목록(왼쪽)과 용어 카드(오른쪽 고정). 휴대폰에서는 QR 찍기 → 검색 → 카드 → 목록 순서 */
:root{
  --blue-900:rgb(23,67,125); --blue:rgb(20,86,240); --blue-500:rgb(59,130,246); --blue-400:rgb(96,165,250); --blue-100:rgb(219,234,254); --blue-200:rgb(191,219,254);
  --grad:linear-gradient(135deg,rgb(20,86,240) 0%,rgb(59,130,246) 50%,rgb(96,165,250) 100%);
  --grad-soft:linear-gradient(135deg,rgb(219,234,254) 0%,rgb(191,219,254) 50%,rgb(147,197,253) 100%);
  --ink:rgb(34,34,34); --ink-2:rgb(69,81,94); --ink-3:rgb(142,142,147);
  --bg:rgb(255,255,255); --panel:rgb(245,247,250); --line:rgb(229,231,235); --line-2:rgb(242,243,245);
  --alert:rgb(180,35,24); --alert-bg:rgb(254,243,242); --alert-line:rgb(254,205,202);
  --cam:rgb(11,15,20);
  --font:"Pretendard","Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","PingFang SC","Microsoft YaHei","Hiragino Sans",system-ui,sans-serif;
  --shadow:0 4px 6px rgba(0,0,0,.08); --glow:0 0 15px rgba(44,30,116,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px;scroll-behavior:smooth}
/* 어르신 모드: 페이지 전체를 비율대로 확대 (화면 폭에 따라 단계적으로) */
html.large{font-size:22px}
html.large .wrap{max-width:1360px}
@media(max-width:920px){html.large{font-size:20px}}
@media(max-width:480px){html.large{font-size:19px}}
html.scanning,html.starting{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1rem;line-height:1.55;font-weight:400;-webkit-text-size-adjust:100%;overflow-wrap:break-word}
/* 한국어만 단어 단위로 줄바꿈 (중국어·일본어는 띄어쓰기가 없어 글자 단위로) */
html:lang(ko) body{word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input{font:inherit;color:inherit}
:is(a,button,input,label):focus-visible{outline:3px solid var(--blue-400);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 헤더 */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-2)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:14px;flex-wrap:wrap}
.brand b{display:block;font-size:1.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.brand span{display:block;font-size:.8rem;font-weight:600;color:var(--blue)}
.brand{line-height:1.2}
.logo{display:block;height:2.4rem;width:auto;flex:none;object-fit:contain}
.langs{display:flex;gap:4px;background:rgba(0,0,0,.05);padding:4px;border-radius:9999px}
.langs button{border:0;background:transparent;border-radius:9999px;padding:6px 12px;font-size:.85rem;font-weight:500;color:var(--ink-2);cursor:pointer}
.langs button[aria-pressed="true"]{background:rgb(255,255,255);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.right{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
@media(max-width:640px){header .right{display:contents}header .brand{order:1}header .logo{order:2}header .langs{order:3}}

/* 첫 화면: 제목 + QR 찍기 */
.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px 28px;align-items:end;padding-block:36px 28px}
@media(max-width:920px){.intro{grid-template-columns:1fr;padding-block:24px 20px}}
.intro-text{min-width:0}
.tag{display:inline-flex;align-items:center;height:2rem;padding:0 14px;border-radius:9999px;background:var(--grad);color:rgb(255,255,255);font-weight:600;font-size:.85rem}
.intro h1{margin-top:14px;font-size:clamp(1.75rem,3.6vw,2.5rem);font-weight:700;line-height:1.2;letter-spacing:-.025em;max-width:22em}
.underline{width:44px;height:5px;border-radius:9999px;background:var(--grad);margin-top:12px}
.intro .sub{margin-top:12px;font-size:1.08rem;font-weight:500;color:var(--ink-2);line-height:1.45;max-width:38em}
.scan-btn{display:flex;align-items:center;gap:16px;width:100%;min-width:0;border:0;border-radius:24px;padding:20px 22px;background:var(--grad);color:rgb(255,255,255);text-align:left;cursor:pointer;box-shadow:var(--glow);transition:transform .15s,box-shadow .15s}
.scan-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(20,86,240,.25)}
.scan-btn:active{transform:translateY(1px)}
.scan-ico{flex:none;width:3.6rem;height:3.6rem;border-radius:18px;background:rgb(255,255,255);color:var(--blue);display:grid;place-items:center}
.scan-ico svg{width:2rem;height:2rem}
.scan-btn b{display:block;font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.scan-btn small{display:block;margin-top:4px;font-size:.95rem;font-weight:500;color:rgba(255,255,255,.9);line-height:1.4}
.scan-btn .arrow{margin-left:auto;flex:none;width:1.5rem;height:1.5rem;opacity:.9}

/* 본문 2단 */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:28px;align-items:start;padding-bottom:56px}
.left{display:flex;flex-direction:column;gap:20px;min-width:0}
.right-col{position:sticky;top:96px;min-width:0}
@media(max-width:920px){.main{grid-template-columns:1fr}.right-col{position:static}.left{display:contents}.searchbox{order:1}.right-col{order:2}.index{order:3}}

.searchbox,.index{min-width:0}
.searchbox{background:var(--panel);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:16px}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;height:3.4rem;border:1.5px solid var(--line);border-radius:14px;padding:0 16px;background:rgb(255,255,255);font-size:1.08rem;font-weight:500}
.search input:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 4px var(--blue-100)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:0 20px;height:3.4rem;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-dark{background:rgb(24,30,37);color:rgb(255,255,255)}
.btn-dark:hover{background:rgb(42,50,60)}
.aud-label{font-size:.85rem;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:rgb(255,255,255);border:1px solid var(--line);border-radius:9999px;padding:4px}
.seg button{border:0;border-radius:9999px;background:transparent;padding:10px 6px;font-weight:600;font-size:.95rem;color:var(--ink-2);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--blue);color:rgb(255,255,255)}
.hint{font-size:.85rem;color:var(--ink-3);margin-top:-6px}

.index h2{font-size:1.15rem;font-weight:700;display:flex;align-items:baseline;gap:8px}
.index h2 .count{font-size:.85rem;font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tabs button{border:1px solid var(--line);background:rgb(255,255,255);border-radius:9999px;padding:7px 14px;font-weight:500;font-size:.9rem;color:var(--ink-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:rgb(255,255,255);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
@media(max-width:420px){.tiles{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:rgb(255,255,255);border-radius:13px;padding:12px 14px;cursor:pointer;min-width:0;transition:border-color .15s,box-shadow .15s}
.tile:hover{border-color:var(--blue-400)}
.tile[aria-current="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.tile b{font-weight:700;font-size:1rem;display:flex;align-items:center;gap:6px}
.tile span{font-size:.85rem;color:var(--ink-2);line-height:1.4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--alert);flex:none}
.empty{grid-column:1/-1;background:var(--panel);border-radius:13px;padding:16px;color:var(--ink-2);font-size:.95rem}

/* 용어 카드 */
.card{border-radius:24px;background:rgb(255,255,255);box-shadow:var(--glow);overflow:hidden;border:1px solid var(--line-2)}
.card-top{background:var(--grad);color:rgb(255,255,255);padding:22px 24px 24px;position:relative}
.card-top .meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill-w{display:inline-flex;align-items:center;gap:6px;height:1.75rem;padding:0 12px;border-radius:9999px;background:rgba(255,255,255,.2);font-size:.8rem;font-weight:600}
.card-top .label{margin-top:16px;font-size:.85rem;font-weight:500;color:rgba(255,255,255,.85)}
.card-top h2{font-size:clamp(2rem,4.2vw,2.75rem);font-weight:700;letter-spacing:-.025em;line-height:1.15;margin-top:2px}
.card-top .plain{margin-top:10px;font-size:1.2rem;font-weight:600;line-height:1.4}
.listen{margin-top:18px;display:inline-flex;align-items:center;gap:8px;border:0;background:rgb(255,255,255);color:var(--blue);border-radius:9999px;padding:10px 18px;font-weight:600;cursor:pointer}
.listen:hover{background:rgb(238,244,255)}
.voice-msg{margin-top:10px;font-size:.85rem;color:rgba(255,255,255,.95)}
.card-body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:20px}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--alert-bg);border:1px solid var(--alert-line);color:var(--alert);border-radius:13px;padding:14px 16px;font-weight:600;line-height:1.5}
.alert svg{flex:none;margin-top:2px}
.blk h3,.mark h3{font-size:.85rem;font-weight:600;color:var(--ink-3);letter-spacing:.02em;margin-bottom:6px}
.def{font-size:1.15rem;font-weight:500;line-height:1.6}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{display:flex;gap:12px;align-items:flex-start;line-height:1.55}
.num{flex:none;width:1.75rem;height:1.75rem;border-radius:50%;background:var(--grad-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;margin-top:1px}
.note{background:var(--line-2);border-radius:13px;padding:12px 14px;color:var(--ink-2);font-size:.95rem;line-height:1.55}
.note b{color:var(--ink);font-weight:600;margin-right:6px}
.mark{border:1px dashed rgb(199,210,224);border-radius:16px;padding:16px}
.mark h3{margin-bottom:10px}
.mark p{font-weight:500;margin-top:10px;color:var(--ink-2)}
.boxes{display:flex;gap:8px;flex-wrap:wrap}
.box{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600;color:var(--ink-3);background:rgb(255,255,255)}
.box i{width:1.05rem;height:1.05rem;border:1.5px solid currentColor;border-radius:4px;display:grid;place-items:center;font-style:normal;flex:none}
.box.on{border-color:var(--blue);color:var(--blue);background:rgb(238,244,255)}
.box.on i{background:var(--blue);border-color:var(--blue)}
.box.on i::after{content:"";width:.5rem;height:.28rem;border:2px solid rgb(255,255,255);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.write{display:flex;align-items:flex-end;min-height:2.6rem;border-bottom:2px solid var(--blue);padding:0 4px 6px;color:var(--blue);font-weight:600;font-size:1.05rem;max-width:22rem}
.related{display:flex;flex-wrap:wrap;gap:6px}
.related button{border:1px solid var(--line);background:rgb(255,255,255);border-radius:9999px;padding:6px 12px;font-size:.9rem;cursor:pointer;color:var(--ink-2)}
.related button:hover{border-color:var(--blue-400);color:var(--blue)}

/* 사용 방법 */
.how{background:var(--panel);padding-block:56px}
.how h2{font-size:1.6rem;font-weight:700;letter-spacing:-.02em}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:24px}
.step{background:rgb(255,255,255);border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative}
.step .n{width:2.25rem;height:2.25rem;border-radius:50%;background:var(--grad);color:rgb(255,255,255);display:grid;place-items:center;font-weight:700}
.step h3{margin-top:14px;font-size:1.05rem;font-weight:600}
.step p{margin-top:6px;color:var(--ink-2);font-size:.93rem}
@media(max-width:860px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:480px){.flow{grid-template-columns:1fr}}
.notice{margin-top:24px;background:rgb(255,255,255);border:1px solid var(--line);border-radius:16px;padding:18px 20px;color:var(--ink-2);font-size:.95rem;line-height:1.6}
.notice b{color:var(--ink);display:block;margin-bottom:2px}
footer{padding-block:24px 36px;color:var(--ink-3);font-size:.85rem;text-align:center}

/* 시작 화면: 글씨 크기 고르기 */
.start{position:fixed;inset:0;z-index:90;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column}
.start-in{width:100%;max-width:980px;margin:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.start-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.start-langs{display:flex}
.start h1{font-size:clamp(1.9rem,4.4vw,2.9rem);font-weight:700;letter-spacing:-.025em;line-height:1.2}
.start .start-sub{margin-top:10px;font-size:1.1rem;font-weight:500;color:var(--ink-2)}
.choices{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px}
@media(max-width:640px){.choices{grid-template-columns:1fr}}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;text-align:left;border:2px solid var(--line);background:rgb(255,255,255);border-radius:24px;padding:24px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.choice:hover{border-color:var(--blue-400);transform:translateY(-2px);box-shadow:var(--shadow)}
.choice .glyph{display:grid;place-items:center;border-radius:18px;background:var(--panel);color:var(--ink);font-weight:700;line-height:1;margin-bottom:10px}
.choice b{font-weight:700;letter-spacing:-.02em;line-height:1.2}
.choice span{color:var(--ink-2);font-weight:500;line-height:1.45}
.choice.small .glyph{width:4.5rem;height:4.5rem;font-size:2rem}
.choice.small b{font-size:1.5rem}
.choice.small span{font-size:1rem}
.choice.big{border-color:var(--blue);background:linear-gradient(135deg,rgba(219,234,254,.55),rgba(255,255,255,1) 60%)}
.choice.big .glyph{width:7rem;height:7rem;font-size:4.4rem;background:var(--grad);color:rgb(255,255,255)}
.choice.big b{font-size:2.5rem}
.choice.big span{font-size:1.35rem;color:var(--ink)}

/* QR 카메라 화면 */
.scanner{position:fixed;inset:0;z-index:100;background:var(--cam);color:rgb(255,255,255);display:flex;flex-direction:column;overflow:hidden}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--cam)}
.scan-top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,0))}
.scan-top h2{font-size:1.15rem;font-weight:700}
.scan-close{width:2.75rem;height:2.75rem;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:rgb(255,255,255);display:grid;place-items:center;cursor:pointer;flex:none}
.scan-close:hover{background:rgba(255,255,255,.28)}
.scan-stage{position:relative;z-index:1;flex:1;display:grid;place-items:center;padding:16px;min-height:0}
.scan-frame{width:min(68vw,46vh,300px);aspect-ratio:1;position:relative;border-radius:24px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scan-frame i{position:absolute;width:44px;height:44px;border:4px solid rgb(255,255,255);border-radius:6px}
.scan-frame i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-top-left-radius:24px}
.scan-frame i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-top-right-radius:24px}
.scan-frame i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-bottom-left-radius:24px}
.scan-frame i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-bottom-right-radius:24px}
.scan-line{position:absolute;left:10%;right:10%;height:3px;border-radius:3px;background:var(--blue-400);box-shadow:0 0 12px var(--blue-400);top:12%;animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{to{top:86%}}
.scan-panel{max-width:26rem;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:20px;padding:22px;text-align:center;line-height:1.6;font-weight:500}
.scan-panel svg{width:2.5rem;height:2.5rem;margin:0 auto 10px;display:block;opacity:.9}
.scan-bottom{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 22px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.65))}
.scan-guide{font-size:1.1rem;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.scan-msg{background:rgb(255,255,255);color:var(--ink);border-radius:13px;padding:10px 16px;font-weight:600;max-width:26rem;font-size:.95rem}
.scan-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.scan-act{height:3rem;padding:0 18px;border-radius:9999px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:rgb(255,255,255);font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.scan-act:hover{background:rgba(255,255,255,.22)}
.scan-act svg{width:1.2rem;height:1.2rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.scan-line{animation:none;top:50%}}
</style>

感じないことです。", "ex": ["手や足をさわっても感覚が鈍い。", "肌にふれる感じがいつもより分かりにくい。", "ある部分がまひしたように感じる。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "unusualSensation": {"ko": {"term": "이상감각", "simple": "평소와 다른 이상한 감각", "def": "몸에서 평소와 다른 이상한 감각이 느껴지는 것을 말합니다.", "ex": ["손이나 발이 저리다.", "피부가 따끔따끔하다.", "벌레가 기어가는 것처럼 느껴진다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Unusual sensation", "simple": "Tingling or prickling", "def": "An unusual feeling such as tingling, prickling or crawling on the skin.", "ex": ["Your hands or feet feel tingly.", "Your skin feels prickly.", "It feels like bugs are crawling on your skin."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "感觉异常", "simple": "发麻或刺痛", "def": "身体出现发麻、刺痛等与平时不同的异常感觉。", "ex": ["手或脚发麻。", "皮肤有刺痛感。", "感觉像有虫子在皮肤上爬。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "異常感覚", "simple": "しびれやチクチク感", "def": "しびれやチクチクなど、いつもと違う感覚があることです。", "ex": ["手や足がしびれる。", "肌がチクチクする。", "虫がはっているように感じる。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "lossOfConsciousness": {"ko": {"term": "의식소실", "simple": "정신을 잃는 것", "def": "갑자기 정신을 잃고 의식이 없어지는 것을 말합니다.", "ex": ["갑자기 쓰러지면서 정신을 잃은 적이 있다.", "잠깐이라도 의식을 잃은 적이 있다.", "주변 사람이 깨워도 반응하지 않았던 적이 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Loss of consciousness", "simple": "Fainting or passing out", "def": "You suddenly lost consciousness, even briefly.", "ex": ["You have suddenly collapsed and passed out.", "You have lost consciousness, even briefly.", "You did not respond even when someone tried to wake you."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "意识丧失", "simple": "晕倒、失去知觉", "def": "突然失去知觉、意识消失。", "ex": ["曾经突然倒下失去知觉。", "曾经短暂失去意识。", "曾经别人叫醒也没有反应。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "意識消失", "simple": "気を失うこと", "def": "急に気を失い、意識がなくなることです。", "ex": ["急に倒れて気を失ったことがある。", "少しの間でも意識を失ったことがある。", "周りの人が起こしても反応しなかったことがある。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "radiatingPain": {"ko": {"term": "방사통", "simple": "다른 부위까지 뻗어가는 통증", "def": "한 곳에서 시작된 통증이 다른 부위까지 뻗어가는 것을 말합니다.", "ex": ["허리가 아프면서 다리까지 통증이 이어진다.", "목이 아프면서 팔까지 통증이 내려간다.", "한 부위의 통증이 다른 부위까지 퍼지는 느낌이 든다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Radiating pain", "simple": "Pain that spreads", "def": "Pain that starts in one place and spreads to another, like back pain going down the leg.", "ex": ["Your lower back hurts and the pain goes down your leg.", "Your neck hurts and the pain goes down your arm.", "Pain in one area feels like it spreads to another."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "放射痛", "simple": "疼痛向别处扩散", "def": "从一处开始的疼痛延伸到其他部位。", "ex": ["腰痛并且疼痛延伸到腿部。", "脖子痛并且疼痛延伸到手臂。", "感觉一个部位的疼痛扩散到其他部位。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "放散痛", "simple": "広がる痛み", "def": "ある場所から始まった痛みが、別の場所まで広がることです。", "ex": ["腰が痛く、その痛みが脚まで続く。", "首が痛く、その痛みが腕まで下りてくる。", "一か所の痛みが別の場所まで広がる感じがする。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "jointStiffness": {"ko": {"term": "관절강직", "simple": "관절이 뻣뻣하게 굳는 것", "def": "관절이 뻣뻣하게 굳어 움직이기 어려운 것을 말합니다.", "ex": ["아침에 일어나면 관절이 뻣뻣하다.", "무릎이나 손가락이 잘 움직이지 않는다.", "오랫동안 움직이지 않으면 관절이 굳는 느낌이 든다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Joint stiffness", "simple": "Stiff joints", "def": "Your joints feel stiff and hard to move.", "ex": ["Your joints feel stiff when you wake up in the morning.", "Your knees or fingers do not move easily.", "Your joints feel stiff after you have not moved for a while."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "关节僵硬", "simple": "关节发僵", "def": "关节僵硬，难以活动。", "ex": ["早上起床时关节发僵。", "膝盖或手指不太灵活。", "长时间不动后关节感觉僵硬。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "関節のこわばり", "simple": "関節がかたくなる", "def": "関節がこわばって動かしにくいことです。", "ex": ["朝起きると関節がこわばっている。", "ひざや指がうまく動かない。", "長い間動かないと関節が固まる感じがする。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "swelling": {"ko": {"term": "부종", "simple": "몸이 붓는 것", "def": "몸의 일부가 평소보다 붓는 것을 말합니다.", "ex": ["발이나 발목이 평소보다 부어 있다.", "다리가 붓고 신발이 꽉 끼는 느낌이 든다.", "부은 곳을 눌렀을 때 손가락 자국이 남는다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Swelling", "simple": "Puffiness", "def": "Part of your body is more swollen than usual.", "ex": ["Your feet or ankles are more swollen than usual.", "Your legs are swollen and your shoes feel tight.", "When you press a swollen area, a finger mark stays."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "水肿", "simple": "身体浮肿", "def": "身体某个部位比平时肿。", "ex": ["脚或脚踝比平时肿。", "腿肿了，鞋子感觉很紧。", "按压肿胀的地方会留下手指印。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "むくみ", "simple": "体がむくむ", "def": "体の一部がいつもよりむくむことです。", "ex": ["足や足首がいつもよりむくんでいる。", "脚がむくんで靴がきつく感じる。", "むくんだところを押すと指の跡が残る。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "jaundice": {"ko": {"term": "황달", "simple": "피부나 눈이 노랗게 변하는 것", "def": "피부나 눈의 흰자위가 평소보다 노랗게 변하는 것을 말합니다.", "ex": ["눈의 흰자위가 노랗게 보인다.", "얼굴이나 피부가 노랗게 변했다.", "평소보다 피부색이 노랗게 보인다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Jaundice", "simple": "Yellow skin or eyes", "def": "Your skin or the whites of your eyes turn yellow.", "ex": ["The whites of your eyes look yellow.", "Your face or skin has turned yellow.", "Your skin looks more yellow than usual."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "黄疸", "simple": "皮肤或眼白发黄", "def": "皮肤或眼白比平时发黄。", "ex": ["眼白看起来发黄。", "脸或皮肤变黄了。", "皮肤颜色比平时更黄。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "黄疸", "simple": "肌や白目が黄色くなる", "def": "肌や白目がいつもより黄色くなることです。", "ex": ["白目が黄色く見える。", "顔や肌が黄色くなった。", "いつもより肌の色が黄色く見える。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "doubleVision": {"ko": {"term": "복시", "simple": "물체가 두 개로 겹쳐 보이는 것", "def": "하나의 물체가 두 개로 겹쳐 보이는 것을 말합니다.", "ex": ["사람이나 물건이 두 개로 보인다.", "한쪽 눈 또는 양쪽 눈으로 볼 때 물체가 겹쳐 보인다.", "글씨가 두 겹으로 보이는 경우가 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Double vision", "simple": "Seeing two of things", "def": "One object looks like two.", "ex": ["People or objects look like two.", "Objects overlap when you look with one or both eyes.", "Letters sometimes look doubled."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "复视", "simple": "看东西重影", "def": "一个物体看起来像两个重叠在一起。", "ex": ["人或物体看起来是两个。", "用一只眼或两只眼看时，物体重叠。", "有时文字看起来是双层的。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "複視", "simple": "物が二重に見える", "def": "一つの物が二つに重なって見えることです。", "ex": ["人や物が二つに見える。", "片目または両目で見ると物が重なって見える。", "文字が二重に見えることがある。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "hearingLoss": {"ko": {"term": "청력감소", "simple": "소리가 잘 들리지 않는 것", "def": "예전보다 소리가 잘 들리지 않는 것을 말합니다.", "ex": ["다른 사람의 말을 자주 되묻는다.", "TV나 휴대전화의 소리를 크게 듣는다.", "주변 사람의 말을 잘 알아듣기 어렵다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Hearing loss", "simple": "Not hearing well", "def": "You cannot hear as well as before.", "ex": ["You often ask people to repeat what they said.", "You turn up the volume on the TV or phone.", "It is hard to understand what people around you say."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "听力下降", "simple": "听不清", "def": "比以前更难听清声音。", "ex": ["经常让别人重复说过的话。", "看电视或用手机时把声音开得很大。", "很难听清周围人说的话。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "聴力低下", "simple": "聞こえにくい", "def": "以前より音が聞こえにくいことです。", "ex": ["人の話をよく聞き返す。", "テレビや携帯電話の音を大きくして聞く。", "周りの人の話が聞き取りにくい。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "pruritus": {"ko": {"term": "소양감", "simple": "피부가 가려운 느낌", "def": "피부가 가려운 느낌을 말합니다.", "ex": ["피부가 계속 가렵다.", "가려워서 자꾸 긁게 된다.", "특정 부위가 간지럽고 불편하다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Itching", "simple": "Itchy skin", "def": "Your skin feels itchy.", "ex": ["Your skin keeps itching.", "You keep scratching because it itches.", "A certain area is itchy and uncomfortable."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "瘙痒", "simple": "皮肤发痒", "def": "皮肤感到发痒。", "ex": ["皮肤一直发痒。", "因为痒而不停地抓。", "某个部位发痒、不舒服。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "かゆみ", "simple": "皮膚がかゆい", "def": "皮膚がかゆい感じのことです。", "ex": ["皮膚がずっとかゆい。", "かゆくて何度もかいてしまう。", "ある部分がむずがゆくて気になる。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "hematemesis": {"ko": {"term": "토혈", "simple": "토할 때 피가 함께 나오는 증상", "def": "토할 때 피가 함께 나오는 것을 말합니다.", "ex": ["토했는데 피가 섞여 나온다.", "토한 내용물이 붉거나 검붉은 색이다.", "피를 토한 적이 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Vomiting blood", "simple": "Blood when you throw up", "def": "It means blood comes up when vomiting.", "ex": ["When you vomit, there is blood in it.", "What you vomit is red or dark red.", "You have vomited blood before."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "呕血", "simple": "呕吐时带血", "def": "指呕吐时同时出现血液。", "ex": ["呕吐物中混有血。", "呕吐物呈红色或暗红色。", "曾经吐过血。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "吐血", "simple": "吐いたものに血が混じる", "def": "吐いたときに血が一緒に出ることです。", "ex": ["吐いたものに血が混じっていた。", "吐いたものが赤い、または赤黒い色だった。", "血を吐いたことがある。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "appetiteLoss": {"ko": {"term": "식욕감퇴", "simple": "평소보다 음식이 먹고 싶지 않거나 식사량이 줄어든 상태", "def": "평소보다 음식이 먹고 싶지 않거나 식사량이 줄어든 것을 말합니다.", "ex": ["평소보다 밥을 적게 먹는다.", "음식이 별로 먹고 싶지 않다.", "예전에는 잘 먹던 음식도 먹기 싫어졌다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Loss of appetite", "simple": "Not feeling like eating", "def": "You do not feel like eating as much as usual, or you eat less.", "ex": ["You eat less than usual.", "You do not really want to eat.", "You no longer want foods you used to enjoy."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "食欲减退", "simple": "不想吃东西", "def": "比平时不想吃东西，或饭量减少。", "ex": ["比平时吃得少。", "不太想吃东西。", "以前爱吃的食物现在也不想吃了。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "食欲低下", "simple": "食欲がない", "def": "いつもより食べたくない、または食べる量が減ったことです。", "ex": ["いつもよりご飯を食べる量が少ない。", "あまり食べたいと思わない。", "以前は好きだった食べ物も食べたくなくなった。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "shortnessOfBreath": {"ko": {"term": "호흡곤란", "simple": "숨쉬기 어렵거나 평소보다 숨이 찬 상태", "def": "숨을 쉬기 어렵거나 평소보다 숨이 차는 것을 말합니다.", "ex": ["가만히 있어도 숨이 차다.", "조금만 걸어도 숨이 많이 찬다.", "숨을 깊게 쉬기 어렵거나 답답하다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Shortness of breath", "simple": "Hard to breathe", "def": "It is hard to breathe, or you get out of breath more than usual.", "ex": ["You are short of breath even when resting.", "You get very out of breath after walking only a little.", "It is hard to take a deep breath, or your chest feels tight."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "呼吸困难", "simple": "喘不上气", "def": "呼吸困难，或比平时更容易气喘。", "ex": ["安静不动时也会气喘。", "稍微走几步就喘得厉害。", "难以深呼吸，或感到胸闷。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "呼吸困難", "simple": "息苦しい", "def": "息がしにくい、またはいつもより息切れすることです。", "ex": ["じっとしていても息が苦しい。", "少し歩いただけでひどく息切れする。", "深く息を吸いにくい、または胸が苦しい。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "chestPain": {"ko": {"term": "흉통", "simple": "가슴 부위의 통증이나 불편감", "def": "가슴 부위에 통증이나 불편한 느낌이 나타나는 것을 말합니다.", "ex": ["가슴이 쑤시거나 아프다.", "가슴이 꽉 눌리는 듯한 느낌이 든다.", "가슴이 답답하거나 불편하다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Chest pain", "simple": "Pain or discomfort in the chest", "def": "Pain or an uncomfortable feeling in your chest.", "ex": ["Your chest aches or hurts.", "Your chest feels tightly squeezed.", "Your chest feels heavy or uncomfortable."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "胸痛", "simple": "胸口疼或不适", "def": "胸部出现疼痛或不舒服的感觉。", "ex": ["胸口刺痛或疼痛。", "感觉胸口被紧紧压住。", "胸口发闷或不舒服。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "胸痛", "simple": "胸の痛みや不快感", "def": "胸に痛みや不快な感じがあることです。", "ex": ["胸がずきずき痛む。", "胸がぎゅっと押さえつけられる感じがする。", "胸が苦しい、または不快だ。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "dizziness": {"ko": {"term": "어지럼증", "simple": "주변이 돌거나 몸이 휘청거리는 느낌", "def": "주변이 빙빙 도는 느낌이나 몸이 휘청거리는 느낌을 말합니다.", "ex": ["주변이 빙빙 도는 것처럼 느껴진다.", "갑자기 일어날 때 어지럽다.", "걸을 때 몸이 휘청거리거나 중심을 잡기 어렵다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Dizziness", "simple": "Spinning or unsteady feeling", "def": "A feeling that things are spinning, or that your body is unsteady.", "ex": ["Everything around you seems to spin.", "You feel dizzy when you stand up suddenly.", "You feel unsteady or have trouble keeping your balance when walking."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "头晕", "simple": "天旋地转或站不稳", "def": "感觉周围在转，或身体摇晃站不稳。", "ex": ["感觉周围在不停地转。", "突然站起来时头晕。", "走路时身体摇晃或难以保持平衡。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "めまい", "simple": "ぐるぐる回る・ふらつく感じ", "def": "周りがぐるぐる回る感じや、体がふらつく感じのことです。", "ex": ["周りがぐるぐる回っているように感じる。", "急に立ち上がるとくらっとする。", "歩くときに体がふらついたり、バランスをとりにくい。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "cough": {"ko": {"term": "기침", "simple": "목이나 기도를 자극하는 것을 없애기 위한 증상", "def": "목이나 기도를 자극하는 것을 없애기 위해 콜록거리는 증상을 말합니다.", "ex": ["한두 번 잠깐 기침한 것이 아니라 반복적으로 기침이 나온다.", "하루 중 여러 번 기침하거나 며칠 이상 기침이 계속된다.", "가래가 나오면서 기침이 난다.", "감기가 나은 후에도 기침이 계속된다.", "목이 간질거리거나 자극될 때마다 잔기침이 반복된다."], "note": "음식이나 물을 잘못 삼켜 잠깐 기침한 경우처럼 일시적인 기침은 제외해도 됩니다.", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Cough", "simple": "Coughing again and again", "def": "Coughing to clear something that irritates your throat or airways.", "ex": ["You cough again and again, not just once or twice.", "You cough several times a day, or the cough lasts for several days.", "You cough up phlegm.", "Your cough continues even after a cold has gone.", "You keep getting small coughs whenever your throat tickles."], "note": "A brief cough, such as from swallowing food or water the wrong way, does not count.", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "咳嗽", "simple": "反复咳嗽", "def": "为了排出刺激喉咙或气道的东西而咳嗽的症状。", "ex": ["不是偶尔咳一两下，而是反复咳嗽。", "一天咳好几次，或咳嗽持续几天以上。", "咳嗽时有痰。", "感冒好了以后仍然咳嗽。", "喉咙一发痒或受刺激就反复干咳。"], "note": "像吃东西或喝水呛到那样暂时的咳嗽可以不算。", "act": "如果符合，请选择“有”。"}, "ja": {"term": "せき", "simple": "くり返し出るせき", "def": "のどや気道への刺激を取り除こうとして、せきが出る症状です。", "ex": ["一、二回だけでなく、くり返しせきが出る。", "一日に何度もせきが出る、または数日以上続いている。", "痰と一緒にせきが出る。", "かぜが治った後もせきが続いている。", "のどがむずむずするたびに、軽いせきがくり返し出る。"], "note": "食べ物や水が気管に入ってむせたときのような、一時的なせきは含めなくてかまいません。", "act": "当てはまる場合は「あり」を選んでください。"}}, "sleepDisorder": {"ko": {"term": "수면장애", "simple": "잠들기 어렵거나 자주 깨고 피로가 계속되는 상태", "def": "잠들기 어렵거나, 자는 동안 자주 깨거나, 충분히 자도 피로감이 계속되는 등 평소 수면에 불편함이 있는 상태를 말합니다.", "ex": ["잠자리에 들어도 잠들기까지 오랜 시간이 걸리는 일이 반복된다.", "밤에 여러 번 깨거나, 깬 후 다시 잠들기 어렵다.", "평소보다 너무 일찍 깨고 다시 잠들기 어렵다.", "충분한 시간 동안 잤는데도 낮 동안 피곤하거나 졸린 상태가 반복된다.", "코골이나 숨이 막히는 느낌 때문에 잠을 자주 깨는 경우가 있다."], "note": "여행이나 특별한 일이 있어 일시적으로 잠을 설친 경우는 제외해도 됩니다.", "act": ""}, "en": {"term": "Sleep disorder", "simple": "Trouble sleeping", "def": "Ongoing trouble with sleep, such as having a hard time falling asleep, waking up often, or still feeling tired after enough sleep.", "ex": ["It often takes you a long time to fall asleep after going to bed.", "You wake up several times at night, or have trouble getting back to sleep.", "You wake up much earlier than usual and cannot fall back asleep.", "You keep feeling tired or sleepy during the day even after enough sleep.", "You often wake up because of snoring or a choking feeling."], "note": "Poor sleep for a short time because of a trip or a special event does not count.", "act": ""}, "zh": {"term": "睡眠障碍", "simple": "睡不好", "def": "难以入睡、睡眠中经常醒来，或睡够了仍持续疲劳等，平时睡眠有困扰的状态。", "ex": ["经常上床后很久才能睡着。", "夜里醒好几次，或醒后难以再入睡。", "比平时醒得太早，之后难以再入睡。", "睡够了时间，白天仍反复感到疲倦或困倦。", "因为打鼾或憋气的感觉而经常醒来。"], "note": "因旅行或特殊情况暂时没睡好的情况可以不算。", "act": ""}, "ja": {"term": "睡眠障害", "simple": "よく眠れない", "def": "寝つきが悪い、夜中によく目が覚める、十分に寝ても疲れが続くなど、ふだんの睡眠に困りごとがある状態です。", "ex": ["布団に入っても、眠るまでに長い時間がかかることがくり返しある。", "夜に何度も目が覚める、または目が覚めた後になかなか眠れない。", "いつもよりかなり早く目が覚め、その後眠れない。", "十分に寝たのに、日中に疲れや眠気がくり返し出る。", "いびきや息が詰まる感じで、よく目が覚めることがある。"], "note": "旅行や特別なことがあって一時的に眠れなかった場合は含めなくてかまいません。", "act": ""}}, "familyHistory": {"ko": {"term": "가족력", "simple": "가족 중 특정 질환을 진단받은 사람이 있는지 묻는 질문", "def": "가족 중 특정 질환을 진단받은 사람이 있는지 묻는 질문입니다.", "ex": ["부모님이 고혈압이나 당뇨를 앓고 있다.", "형제자매가 심장질환을 진단받은 적이 있다.", "가족 중 암을 진단받은 사람이 있다."], "note": "", "act": ""}, "en": {"term": "Family history", "simple": "Illnesses in your family", "def": "It asks whether anyone in your family has been diagnosed with a certain disease.", "ex": ["Your parents have high blood pressure or diabetes.", "A brother or sister has been diagnosed with heart disease.", "Someone in your family has been diagnosed with cancer."], "note": "", "act": ""}, "zh": {"term": "家族病史", "simple": "家人患过的病", "def": "询问家人中是否有人被诊断患有某种疾病。", "ex": ["父母患有高血压或糖尿病。", "兄弟姐妹曾被诊断出心脏病。", "家人中有人被诊断出癌症。"], "note": "", "act": ""}, "ja": {"term": "家族歴", "simple": "家族がかかった病気", "def": "家族の中に特定の病気と診断された人がいるかをたずねる質問です。", "ex": ["両親が高血圧や糖尿病をわずらっている。", "きょうだいが心臓の病気と診断されたことがある。", "家族の中にがんと診断された人がいる。"], "note": "", "act": ""}}, "medication": {"ko": {"term": "복용 중인 약", "simple": "지금 먹고 있는 약", "def": "현재 꾸준히 먹거나 필요할 때 복용하고 있는 약을 말합니다.", "ex": ["혈압약이나 당뇨약을 매일 먹고 있다.", "병원에서 처방받은 약을 현재 먹고 있다.", "두통이나 통증 때문에 필요할 때 약을 먹고 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Current medications", "simple": "Medicines you take now", "def": "Medicines you take regularly, or take when needed.", "ex": ["You take blood pressure or diabetes medicine every day.", "You are taking medicine prescribed by a hospital.", "You take medicine when needed, for example for headaches or pain."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "正在服用的药物", "simple": "现在吃的药", "def": "目前长期服用或需要时服用的药物。", "ex": ["每天服用降压药或降糖药。", "正在服用医院开的处方药。", "头痛或疼痛时需要服用药物。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "服用中の薬", "simple": "今飲んでいる薬", "def": "今続けて飲んでいる薬、または必要なときに飲んでいる薬のことです。", "ex": ["血圧の薬や糖尿病の薬を毎日飲んでいる。", "病院で処方された薬を今飲んでいる。", "頭痛や痛みのときに、必要に応じて薬を飲んでいる。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "supplements": {"ko": {"term": "건강기능식품", "simple": "건강을 위해 챙겨 먹는 제품", "def": "건강을 위해 챙겨 먹는 제품을 말합니다.", "ex": ["비타민이나 오메가3를 먹고 있다.", "홍삼이나 유산균을 먹고 있다.", "관절이나 눈 건강을 위한 건강기능식품을 먹고 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Dietary supplements", "simple": "Health products you take", "def": "Products you take to stay healthy.", "ex": ["You take vitamins or omega-3.", "You take red ginseng or probiotics.", "You take supplements for your joints or eyes."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "保健食品", "simple": "为健康吃的产品", "def": "为了健康而服用的产品。", "ex": ["正在吃维生素或欧米伽3。", "正在吃红参或益生菌。", "正在吃有益关节或眼睛健康的保健食品。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "健康食品・サプリメント", "simple": "健康のためにとる製品", "def": "健康のためにとっている製品のことです。", "ex": ["ビタミンやオメガ3を飲んでいる。", "紅参（高麗人参）や乳酸菌をとっている。", "関節や目の健康のためのサプリメントを飲んでいる。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "pastSurgery": {"ko": {"term": "과거 수술", "simple": "예전에 받은 수술", "def": "예전에 병원에서 수술을 받은 경험을 말합니다.", "ex": ["오래전에 맹장수술을 받은 적이 있다.", "몇 년 전에 무릎이나 허리 수술을 받은 적이 있다.", "출산과 관련된 수술을 받은 적이 있다."], "note": "", "act": "예전에 받은 수술도 해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Past surgery", "simple": "Operations you have had", "def": "Any operation you have had at a hospital in the past.", "ex": ["You had your appendix removed a long time ago.", "You had knee or back surgery a few years ago.", "You had surgery related to childbirth, such as a C-section."], "note": "", "act": "Surgeries from long ago count too. If this applies to you, choose ‘Yes’."}, "zh": {"term": "手术史", "simple": "以前做过的手术", "def": "以前在医院做过手术的经历。", "ex": ["很久以前做过阑尾手术。", "几年前做过膝盖或腰部手术。", "做过与分娩有关的手术（如剖腹产）。"], "note": "", "act": "很久以前的手术也算。如果符合，请选择“有”。"}, "ja": {"term": "手術歴", "simple": "以前受けた手術", "def": "以前に病院で手術を受けた経験のことです。", "ex": ["ずっと前に盲腸の手術を受けたことがある。", "数年前にひざや腰の手術を受けたことがある。", "出産に関係する手術（帝王切開など）を受けたことがある。"], "note": "", "act": "昔の手術も含みます。当てはまる場合は「あり」を選んでください。"}}, "allergy": {"ko": {"term": "알레르기", "simple": "몸의 이상 반응", "def": "특정 음식이나 약 등을 먹거나 접했을 때 몸에 이상 반응이 나타나는 것을 말합니다.", "ex": ["특정 음식을 먹으면 두드러기가 난다.", "특정 약을 먹으면 피부에 발진이 생긴다.", "특정 물질에 닿으면 피부가 가렵거나 붓는다."], "note": "정확히 알레르기인지 모르겠다면 ‘기타’ 또는 의료진에게 알려주세요.", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Allergy", "simple": "A bad reaction to something", "def": "Your body reacts badly after eating, taking or touching certain things, such as foods or medicines.", "ex": ["You get hives after eating a certain food.", "You get a rash after taking a certain medicine.", "Your skin itches or swells after touching a certain material."], "note": "If you are not sure whether it is an allergy, choose ‘Other’ or tell the staff.", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "过敏", "simple": "身体出现异常反应", "def": "吃了或接触某些食物、药物等后，身体出现异常反应。", "ex": ["吃某种食物后会起荨麻疹。", "吃某种药后皮肤会出疹子。", "接触某种物质后皮肤会发痒或肿起来。"], "note": "如果不确定是不是过敏，请选择“其他”或告诉医护人员。", "act": "如果符合，请选择“有”。"}, "ja": {"term": "アレルギー", "simple": "体に異常な反応が出る", "def": "特定の食べ物や薬などを口にしたり、ふれたりしたときに、体に異常な反応が出ることです。", "ex": ["特定の食べ物を食べるとじんましんが出る。", "特定の薬を飲むと皮膚に発疹が出る。", "特定のものにふれると皮膚がかゆくなったり、はれたりする。"], "note": "アレルギーかどうかわからない場合は「その他」を選ぶか、医療スタッフに伝えてください。", "act": "当てはまる場合は「あり」を選んでください。"}}, "drugAllergy": {"ko": {"term": "약물 알레르기", "simple": "약에 대한 이상 반응", "def": "특정 약을 먹거나 주사를 맞은 후 몸에 이상 반응이 나타나는 것을 말합니다.", "ex": ["특정 약을 먹으면 두드러기가 난다.", "약을 먹은 후 피부가 심하게 가렵거나 붓는다.", "특정 약을 먹은 후 이상 반응이 나타난 적이 있다."], "note": "정확히 알레르기인지 모르겠다면 ‘기타’ 또는 의료진에게 알려주세요.", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Drug allergy", "simple": "A bad reaction to medicine", "def": "Your body reacted badly after taking a certain medicine or getting an injection.", "ex": ["You get hives after taking a certain medicine.", "Your skin becomes very itchy or swollen after taking medicine.", "You have had an unusual reaction after taking a certain medicine."], "note": "If you are not sure whether it is an allergy, choose ‘Other’ or tell the staff.", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "药物过敏", "simple": "对药物的异常反应", "def": "服用某种药物或打针后，身体出现异常反应。", "ex": ["吃某种药后会起荨麻疹。", "吃药后皮肤严重发痒或肿起来。", "曾经在吃某种药后出现异常反应。"], "note": "如果不确定是不是过敏，请选择“其他”或告诉医护人员。", "act": "如果符合，请选择“有”。"}, "ja": {"term": "薬物アレルギー", "simple": "薬への異常な反応", "def": "特定の薬を飲んだり注射を受けたりした後、体に異常な反応が出ることです。", "ex": ["特定の薬を飲むとじんましんが出る。", "薬を飲んだ後、皮膚がひどくかゆくなったり、はれたりする。", "特定の薬を飲んだ後に、異常な反応が出たことがある。"], "note": "アレルギーかどうかわからない場合は「その他」を選ぶか、医療スタッフに伝えてください。", "act": "当てはまる場合は「あり」を選んでください。"}}, "fever": {"ko": {"term": "발열", "simple": "열이 남", "def": "평소보다 체온이 올라가 열이 나는 상태를 말합니다.", "ex": ["체온을 쟀을 때 평소보다 높게 나온 적이 있다.", "몸이 뜨겁고 열이 나는 느낌이 들었다.", "열이 나면서 오한이나 몸살 증상이 함께 있었다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Fever", "simple": "Having a temperature", "def": "Your body temperature is higher than usual.", "ex": ["Your temperature was higher than usual when you measured it.", "Your body felt hot, like you had a fever.", "You had a fever along with chills or body aches."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "发热", "simple": "发烧", "def": "体温比平时高，出现发烧的状态。", "ex": ["量体温时比平时高。", "感觉身体发烫、在发烧。", "发烧的同时还有发冷或浑身酸痛。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "発熱", "simple": "熱が出る", "def": "体温がいつもより上がり、熱が出ている状態です。", "ex": ["体温を測ったら、いつもより高かったことがある。", "体が熱く、熱っぽい感じがした。", "熱が出て、寒気や体のだるさ・痛みもあった。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "weightChange": {"ko": {"term": "체중 변화", "simple": "몸무게가 달라짐", "def": "최근 평소와 비교하여 몸무게가 달라진 것을 말합니다.", "ex": ["특별히 다이어트를 하지 않았는데 몸무게가 줄었다.", "평소보다 몸무게가 갑자기 늘었다.", "최근 몸무게가 평소와 크게 달라졌다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Weight change", "simple": "Weight going up or down", "def": "Your weight has recently changed compared with usual.", "ex": ["You lost weight without trying to diet.", "You suddenly gained more weight than usual.", "Your weight has recently changed a lot."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "体重变化", "simple": "体重有变化", "def": "最近体重与平时相比有所变化。", "ex": ["没有特意减肥，体重却下降了。", "体重比平时突然增加了。", "最近体重和平时相比变化很大。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "体重の変化", "simple": "体重が変わった", "def": "最近、いつもと比べて体重が変わったことです。", "ex": ["ダイエットをしていないのに体重が減った。", "いつもより急に体重が増えた。", "最近、体重がいつもと大きく変わった。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "headache": {"ko": {"term": "두통", "simple": "머리가 아픔", "def": "머리에서 통증이나 불편한 느낌이 나타나는 것을 말합니다.", "ex": ["머리가 지끈거리거나 욱신거린다.", "머리가 무겁거나 조이는 듯하다.", "평소와 다른 두통이 생겼다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Headache", "simple": "Pain in your head", "def": "Pain or discomfort in your head.", "ex": ["Your head throbs or pounds.", "Your head feels heavy or tight.", "You have a headache that feels different from usual."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "头痛", "simple": "头疼", "def": "头部出现疼痛或不舒服的感觉。", "ex": ["头一跳一跳地疼，或阵阵作痛。", "头感觉沉重或像被勒紧一样。", "出现了和平时不一样的头痛。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "頭痛", "simple": "頭が痛い", "def": "頭に痛みや不快な感じがあることです。", "ex": ["頭がずきずき、がんがんする。", "頭が重い、またはしめつけられる感じがする。", "いつもと違う頭痛がある。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "pastHistory": {"ko": {"term": "과거력", "simple": "예전에 앓았거나 지금 앓고 있는 병", "def": "지금까지 진단받았거나 치료받은 병이 있는지를 말합니다.", "ex": ["고혈압이나 당뇨로 약을 먹고 있다.", "예전에 결핵이나 간염을 앓은 적이 있다.", "지금은 나았지만 예전에 입원해서 치료받은 병이 있다."], "note": "", "act": "해당하는 병이 있다면 표시하고 병 이름을 적어 주세요."}, "en": {"term": "Past medical history", "simple": "Illnesses you have had", "def": "Whether you have ever been diagnosed with or treated for an illness.", "ex": ["You take medicine for high blood pressure or diabetes.", "You had tuberculosis or hepatitis in the past.", "You were once in hospital for an illness, even if you are better now."], "note": "", "act": "If you have had an illness, mark it and write its name."}, "zh": {"term": "既往病史", "simple": "以前得过或正在患的病", "def": "到目前为止是否被诊断出或治疗过某种疾病。", "ex": ["因高血压或糖尿病正在吃药。", "以前得过结核或肝炎。", "虽然现在好了，但以前因病住院治疗过。"], "note": "", "act": "如果有相关疾病，请勾选并写下病名。"}, "ja": {"term": "既往歴", "simple": "以前かかった病気・今ある病気", "def": "これまでに診断された病気や、治療を受けた病気があるかどうかのことです。", "ex": ["高血圧や糖尿病で薬を飲んでいる。", "以前に結核や肝炎にかかったことがある。", "今は治ったが、以前入院して治療した病気がある。"], "note": "", "act": "当てはまる病気があれば印をつけ、病名を書いてください。"}}, "dyslipidemia": {"ko": {"term": "고지혈증", "simple": "핏속에 기름기가 많은 상태", "def": "혈액 속 콜레스테롤이나 중성지방이 정상보다 많은 상태를 말합니다. ‘이상지질혈증’이라고도 해요.", "ex": ["건강검진에서 콜레스테롤이 높다는 말을 들었다.", "콜레스테롤을 낮추는 약을 먹고 있다.", "병원에서 기름진 음식을 줄이라는 말을 들었다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "High cholesterol", "simple": "Too much fat in the blood", "def": "Cholesterol or triglycerides (fats) in your blood are higher than normal. Also called dyslipidemia.", "ex": ["A health checkup showed your cholesterol is high.", "You take medicine to lower cholesterol.", "A doctor told you to eat less fatty food."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "高脂血症", "simple": "血液里脂肪多", "def": "血液中的胆固醇或甘油三酯高于正常水平，也叫“血脂异常”。", "ex": ["体检时被告知胆固醇偏高。", "正在服用降胆固醇的药。", "医生建议少吃油腻食物。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "高脂血症", "simple": "血液中の脂質が多い状態", "def": "血液中のコレステロールや中性脂肪が正常より多い状態です。「脂質異常症」ともいいます。", "ex": ["健康診断でコレステロールが高いと言われた。", "コレステロールを下げる薬を飲んでいる。", "病院で脂っこい食べ物を減らすように言われた。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "stroke": {"ko": {"term": "뇌졸중", "simple": "뇌혈관이 막히거나 터지는 병", "def": "뇌로 가는 혈관이 막히거나(뇌경색) 터져서(뇌출혈) 뇌가 손상되는 병을 말합니다. ‘중풍’이라고도 해요.", "ex": ["뇌경색이나 뇌출혈로 진단받은 적이 있다.", "중풍으로 치료받은 적이 있다.", "뇌혈관 질환 때문에 약을 먹고 있다."], "note": "지금 갑자기 한쪽 얼굴이나 팔다리에 힘이 빠지거나 말이 어눌해졌다면 바로 의료진에게 알려 주세요.", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Stroke", "simple": "A blocked or burst blood vessel in the brain", "def": "The brain is damaged because a blood vessel to it is blocked or bursts.", "ex": ["You have been diagnosed with a stroke caused by a blockage or bleeding in the brain.", "You have been treated for a stroke.", "You take medicine because of a problem with the blood vessels in your brain."], "note": "If one side of your face, arm or leg suddenly feels weak, or your speech becomes unclear, tell the staff right away.", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "脑卒中（中风）", "simple": "脑血管堵塞或破裂的病", "def": "通往大脑的血管堵塞（脑梗死）或破裂（脑出血），导致大脑受损的疾病，也叫“中风”。", "ex": ["曾被诊断为脑梗死或脑出血。", "曾因中风接受过治疗。", "因脑血管疾病正在吃药。"], "note": "如果现在突然一侧脸部或手脚无力，或说话含糊不清，请立即告诉医护人员。", "act": "如果符合，请选择“有”。"}, "ja": {"term": "脳卒中", "simple": "脳の血管が詰まる・破れる病気", "def": "脳へ向かう血管が詰まったり（脳梗塞）破れたり（脳出血）して、脳が傷つく病気です。", "ex": ["脳梗塞や脳出血と診断されたことがある。", "脳卒中で治療を受けたことがある。", "脳の血管の病気のために薬を飲んでいる。"], "note": "今、急に顔や手足の片側に力が入らない、または言葉がうまく話せない場合は、すぐに医療スタッフに伝えてください。", "act": "当てはまる場合は「あり」を選んでください。"}}, "angina": {"ko": {"term": "협심증", "simple": "심장 혈관이 좁아진 병", "def": "심장에 피를 보내는 혈관이 좁아져서, 움직일 때 가슴이 조이거나 아픈 병을 말합니다.", "ex": ["협심증으로 진단받은 적이 있다.", "심장 혈관을 넓히는 시술(스텐트)을 받은 적이 있다.", "가슴이 아플 때 혀 밑에 넣는 약을 처방받은 적이 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Angina", "simple": "Narrowed heart blood vessels", "def": "The blood vessels that supply the heart become narrow, so your chest feels tight or painful when you move.", "ex": ["You have been diagnosed with angina.", "You have had a procedure to open a heart blood vessel (a stent).", "You have been prescribed a medicine to put under your tongue when your chest hurts."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "心绞痛", "simple": "心脏血管变窄的病", "def": "给心脏供血的血管变窄，活动时胸口发紧或疼痛的疾病。", "ex": ["曾被诊断为心绞痛。", "做过扩张心脏血管的手术（支架）。", "曾开过胸痛时放在舌下的药。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "狭心症", "simple": "心臓の血管が狭くなる病気", "def": "心臓に血液を送る血管が狭くなり、体を動かすと胸がしめつけられたり痛んだりする病気です。", "ex": ["狭心症と診断されたことがある。", "心臓の血管を広げる治療（ステント）を受けたことがある。", "胸が痛いときに舌の下に入れる薬を処方されたことがある。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "tuberculosis": {"ko": {"term": "결핵", "simple": "결핵균 때문에 생기는 폐 질환", "def": "결핵균에 감염되어 주로 폐에 생기는 병을 말합니다. 기침으로 다른 사람에게 옮을 수 있어요.", "ex": ["예전에 결핵 진단을 받고 약을 먹은 적이 있다.", "가족이나 함께 지내는 사람이 결핵을 앓았다.", "검사에서 결핵을 앓았던 흔적이 있다는 말을 들었다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Tuberculosis (TB)", "simple": "A lung infection caused by TB germs", "def": "An infection caused by tuberculosis bacteria, mostly in the lungs. It can spread to others through coughing.", "ex": ["You were diagnosed with TB in the past and took medicine for it.", "A family member or someone you live with has had TB.", "A test showed signs that you had TB before."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "结核", "simple": "结核菌引起的肺部疾病", "def": "感染结核菌后主要发生在肺部的疾病，可通过咳嗽传染给他人。", "ex": ["以前被诊断出结核并吃过药。", "家人或一起生活的人得过结核。", "检查时被告知有得过结核的痕迹。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "結核", "simple": "結核菌による肺の病気", "def": "結核菌に感染して、主に肺に起こる病気です。せきで他の人にうつることがあります。", "ex": ["以前に結核と診断され、薬を飲んだことがある。", "家族や一緒に暮らす人が結核にかかった。", "検査で、結核にかかった跡があると言われた。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "hepatitis": {"ko": {"term": "간염", "simple": "간에 염증이 생긴 병", "def": "바이러스나 술, 약 등으로 간에 염증이 생긴 병을 말합니다. B형, C형 간염이 대표적이에요.", "ex": ["B형 또는 C형 간염 진단을 받은 적이 있다.", "간염 보균자라는 말을 들었다.", "간 수치가 높아 치료받은 적이 있다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Hepatitis", "simple": "Inflammation of the liver", "def": "The liver becomes inflamed because of a virus, alcohol, medicine or other causes. Hepatitis B and C are common types.", "ex": ["You have been diagnosed with hepatitis B or C.", "You were told you carry the hepatitis virus.", "You were treated because your liver test results were high."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "肝炎", "simple": "肝脏发炎的病", "def": "因病毒、饮酒、药物等原因导致肝脏发炎的疾病，常见的有乙型肝炎和丙型肝炎。", "ex": ["曾被诊断为乙型或丙型肝炎。", "被告知是肝炎病毒携带者。", "曾因肝功能指标偏高接受过治疗。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "肝炎", "simple": "肝臓に炎症が起きる病気", "def": "ウイルスやお酒、薬などが原因で肝臓に炎症が起きる病気です。B型・C型肝炎が代表的です。", "ex": ["B型またはC型肝炎と診断されたことがある。", "肝炎ウイルスのキャリアだと言われた。", "肝臓の数値が高く、治療を受けたことがある。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "asthma": {"ko": {"term": "천식", "simple": "기관지가 좁아져 숨이 차는 병", "def": "기관지가 예민해져 좁아지면서 기침, 쌕쌕거리는 숨소리, 숨참이 반복되는 병을 말합니다.", "ex": ["천식 진단을 받은 적이 있다.", "숨이 찰 때 쓰는 흡입기를 가지고 있다.", "숨 쉴 때 쌕쌕거리는 소리가 자주 난다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Asthma", "simple": "Narrowed airways that make breathing hard", "def": "The airways become sensitive and narrow, causing repeated coughing, wheezing and shortness of breath.", "ex": ["You have been diagnosed with asthma.", "You have an inhaler for when you are short of breath.", "You often make a wheezing sound when you breathe."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "哮喘", "simple": "支气管变窄、喘不上气的病", "def": "支气管变得敏感并收窄，反复出现咳嗽、喘鸣和气喘的疾病。", "ex": ["曾被诊断为哮喘。", "有气喘时使用的吸入器。", "呼吸时经常发出“咝咝”的喘鸣声。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "ぜんそく", "simple": "気管支が狭くなり息苦しくなる病気", "def": "気管支が敏感になって狭くなり、せき、ゼーゼーという呼吸音、息苦しさをくり返す病気です。", "ex": ["ぜんそくと診断されたことがある。", "息苦しいときに使う吸入薬を持っている。", "息をするとき、ゼーゼー・ヒューヒューという音がよくする。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "anticoagulant": {"ko": {"term": "항응고제", "simple": "피를 묽게 하는 약", "def": "피가 굳어 혈관이 막히지 않도록 피를 묽게 해 주는 약을 말합니다. 아스피린 같은 약도 함께 물어보는 경우가 많아요.", "ex": ["와파린이나 아스피린을 먹고 있다.", "심장이나 뇌혈관 때문에 피를 묽게 하는 약을 처방받았다.", "약을 먹은 뒤로 작은 상처에도 피가 잘 멈추지 않는다."], "note": "검사나 시술 전에는 이 약을 잠시 멈춰야 할 수 있어요. 스스로 끊지 말고 꼭 의료진에게 알려 주세요.", "act": "먹고 있다면 ‘있음’을 선택하고 약 이름을 적어 주세요."}, "en": {"term": "Blood thinners", "simple": "Medicine that thins your blood", "def": "Medicine that keeps your blood from clotting and blocking blood vessels. Medicines like aspirin are often asked about too.", "ex": ["You take warfarin or aspirin.", "You were prescribed a blood thinner for your heart or brain blood vessels.", "Since taking a medicine, even small cuts do not stop bleeding easily."], "note": "You may need to pause this medicine before a test or procedure. Do not stop it yourself; tell the staff.", "act": "If you take one, choose ‘Yes’ and write the medicine name."}, "zh": {"term": "抗凝血药", "simple": "让血液变稀的药", "def": "防止血液凝固、堵塞血管的药物。医生通常也会询问是否服用阿司匹林等药物。", "ex": ["正在服用华法林或阿司匹林。", "因心脏或脑血管问题被开了抗凝血药。", "吃药后，小伤口也不容易止血。"], "note": "做检查或手术前可能需要暂停这种药。请不要自行停药，务必告诉医护人员。", "act": "如果正在服用，请选择“有”并写下药名。"}, "ja": {"term": "抗凝固薬（血液をサラサラにする薬）", "simple": "血液をサラサラにする薬", "def": "血液が固まって血管が詰まらないように、血液をサラサラにする薬です。アスピリンなどの薬もあわせてたずねることが多いです。", "ex": ["ワルファリンやアスピリンを飲んでいる。", "心臓や脳の血管のために、血液をサラサラにする薬を処方されている。", "薬を飲み始めてから、小さな傷でも血が止まりにくい。"], "note": "検査や処置の前に、この薬を一時的に止める必要がある場合があります。自分でやめずに、必ず医療スタッフに伝えてください。", "act": "飲んでいる場合は「あり」を選び、薬の名前を書いてください。"}}, "pregnancy": {"ko": {"term": "임신 가능성", "simple": "지금 임신했을 수 있는지", "def": "현재 임신 중이거나 임신했을 가능성이 있는지를 묻는 질문입니다. 엑스레이 검사나 약 처방 전에 꼭 확인해요.", "ex": ["현재 임신 중이다.", "생리가 예정일보다 늦어지고 있다.", "임신 테스트기에서 양성이 나왔다."], "note": "잘 모르겠다면 엑스레이 검사나 약 처방 전에 꼭 의료진에게 말해 주세요.", "act": "가능성이 있다면 ‘있음’을 선택해주세요."}, "en": {"term": "Possible pregnancy", "simple": "Whether you might be pregnant", "def": "Asks whether you are pregnant now or could be. This is checked before X-rays or prescribing medicine.", "ex": ["You are pregnant now.", "Your period is later than expected.", "A pregnancy test showed a positive result."], "note": "If you are not sure, tell the staff before any X-ray or new medicine.", "act": "If you might be pregnant, choose ‘Yes’."}, "zh": {"term": "怀孕可能性", "simple": "现在是否可能怀孕", "def": "询问您目前是否怀孕或有怀孕的可能。在拍X光或开药前必须确认。", "ex": ["目前正在怀孕。", "月经比预期推迟了。", "验孕棒显示阳性。"], "note": "如果不确定，请在拍X光或开药前一定告诉医护人员。", "act": "如果有可能，请选择“有”。"}, "ja": {"term": "妊娠の可能性", "simple": "今、妊娠している可能性", "def": "現在妊娠しているか、妊娠している可能性があるかをたずねる質問です。レントゲン検査や薬の処方の前に必ず確認します。", "ex": ["現在妊娠中である。", "生理が予定日より遅れている。", "妊娠検査薬で陽性が出た。"], "note": "わからない場合は、レントゲン検査や薬の処方の前に必ず医療スタッフに伝えてください。", "act": "可能性がある場合は「あり」を選んでください。"}}, "lmp": {"ko": {"term": "마지막 월경일", "simple": "가장 최근 생리를 시작한 날", "def": "가장 최근에 생리를 시작한 첫날의 날짜를 말합니다. 끝난 날이 아니라 시작한 날을 적어요.", "ex": ["지난달 15일에 생리를 시작했다면 그 날짜를 적는다.", "날짜가 정확하지 않다면 대략적인 날짜를 적는다.", "폐경이 되었다면 ‘폐경’이라고 적는다."], "note": "", "act": "생리를 시작한 첫날의 날짜를 적어 주세요.", "kind": "write", "sample": "2026. 10. 15."}, "en": {"term": "Last menstrual period", "simple": "The day your last period started", "def": "The date of the first day of your most recent period. Write the day it started, not the day it ended.", "ex": ["If your period started on the 15th of last month, write that date.", "If you are not sure of the exact date, write an approximate one.", "If you have gone through menopause, write ‘menopause’."], "note": "", "act": "Write the date your last period started.", "kind": "write", "sample": "Oct 15, 2026"}, "zh": {"term": "末次月经", "simple": "最近一次月经开始的日期", "def": "最近一次月经开始第一天的日期。请写开始的日期，而不是结束的日期。", "ex": ["如果上个月15日开始来月经，就写那天的日期。", "如果记不清确切日期，可以写大概的日期。", "如果已经绝经，请写“绝经”。"], "note": "", "act": "请写下最近一次月经开始第一天的日期。", "kind": "write", "sample": "2026年10月15日"}, "ja": {"term": "最終月経日", "simple": "最後に生理が始まった日", "def": "いちばん最近の生理が始まった初日の日付です。終わった日ではなく、始まった日を書きます。", "ex": ["先月15日に生理が始まったなら、その日付を書く。", "正確な日付がわからなければ、だいたいの日付を書く。", "閉経している場合は「閉経」と書く。"], "note": "", "act": "最後の生理が始まった初日の日付を書いてください。", "kind": "write", "sample": "2026年10月15日"}}, "smoking": {"ko": {"term": "흡연력", "simple": "담배를 피운 기간과 양", "def": "지금 담배를 피우거나 예전에 피웠는지, 얼마나 오래 얼마나 많이 피웠는지를 묻는 항목입니다.", "ex": ["지금 하루에 반 갑 정도 피운다.", "10년 동안 피우다가 3년 전에 끊었다.", "전자담배를 피우고 있다."], "note": "‘갑년’은 하루에 피운 갑 수에 피운 햇수를 곱한 값이에요. 예: 하루 1갑씩 10년 = 10갑년.", "act": "지금 피우는지, 끊었는지, 피운 적이 없는지 골라 주세요.", "opts": ["현재 흡연", "과거 흡연", "비흡연"]}, "en": {"term": "Smoking history", "simple": "How long and how much you have smoked", "def": "Asks whether you smoke now or used to, and how long and how much you have smoked.", "ex": ["You smoke about half a pack a day now.", "You smoked for 10 years and quit 3 years ago.", "You use e-cigarettes."], "note": "‘Pack-years’ = packs smoked per day × years smoked. For example, 1 pack a day for 10 years = 10 pack-years.", "act": "Choose whether you smoke now, have quit, or have never smoked.", "opts": ["Smoke now", "Quit", "Never"]}, "zh": {"term": "吸烟史", "simple": "吸烟的时间和数量", "def": "询问您现在是否吸烟或以前是否吸过烟，以及吸了多久、吸了多少。", "ex": ["现在每天吸半包左右。", "吸了10年，3年前戒了。", "正在使用电子烟。"], "note": "“包年”＝每天吸烟包数×吸烟年数。例如：每天1包、吸了10年＝10包年。", "act": "请选择现在吸烟、已戒烟或从不吸烟。", "opts": ["现在吸烟", "已戒烟", "从不吸烟"]}, "ja": {"term": "喫煙歴", "simple": "たばこを吸った期間と量", "def": "今たばこを吸っているか、以前吸っていたか、どのくらいの期間・量を吸ったかをたずねる項目です。", "ex": ["今、1日に半箱くらい吸っている。", "10年間吸っていたが、3年前にやめた。", "電子たばこを吸っている。"], "note": "「パックイヤー」は、1日に吸う箱数×吸った年数です。例：1日1箱を10年＝10パックイヤー。", "act": "今吸っている、やめた、吸ったことがない、から選んでください。", "opts": ["現在喫煙", "過去に喫煙", "吸わない"]}}, "drinking": {"ko": {"term": "음주력", "simple": "술을 마시는 횟수와 양", "def": "술을 얼마나 자주, 한 번에 얼마나 마시는지를 묻는 항목입니다.", "ex": ["일주일에 2번, 한 번에 소주 반 병 정도 마신다.", "한 달에 1~2번 맥주를 마신다.", "예전에는 마셨지만 지금은 끊었다."], "note": "", "act": "마시는 횟수와 한 번에 마시는 양을 적어 주세요.", "kind": "write", "sample": "주 2회, 소주 반 병"}, "en": {"term": "Drinking history", "simple": "How often and how much you drink", "def": "Asks how often you drink alcohol and how much you drink at one time.", "ex": ["You drink twice a week, about half a bottle of soju each time.", "You drink beer once or twice a month.", "You used to drink but have stopped."], "note": "", "act": "Write how often you drink and how much at one time.", "kind": "write", "sample": "2 times a week, half a bottle of soju"}, "zh": {"term": "饮酒史", "simple": "喝酒的次数和量", "def": "询问您多久喝一次酒、每次喝多少。", "ex": ["每周喝2次，每次大约半瓶烧酒。", "每月喝1～2次啤酒。", "以前喝酒，现在戒了。"], "note": "", "act": "请写下喝酒的次数和每次的量。", "kind": "write", "sample": "每周2次，半瓶烧酒"}, "ja": {"term": "飲酒歴", "simple": "お酒を飲む回数と量", "def": "お酒をどのくらいの頻度で、1回にどのくらい飲むかをたずねる項目です。", "ex": ["週に2回、1回に焼酎を半瓶くらい飲む。", "月に1～2回ビールを飲む。", "以前は飲んでいたが、今はやめた。"], "note": "", "act": "飲む回数と1回に飲む量を書いてください。", "kind": "write", "sample": "週2回、焼酎半瓶"}}, "chills": {"ko": {"term": "오한", "simple": "몸이 춥고 떨림", "def": "열이 오르기 전이나 열이 날 때 몸이 으슬으슬 춥고 떨리는 것을 말합니다.", "ex": ["따뜻한 곳에 있어도 몸이 으슬으슬 춥다.", "이가 딱딱 부딪칠 정도로 몸이 떨린다.", "열이 나면서 춥고 떨렸다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Chills", "simple": "Feeling cold and shivery", "def": "Feeling cold and shivering, often before or during a fever.", "ex": ["You feel cold even in a warm place.", "You shiver so much your teeth chatter.", "You felt cold and shivery while you had a fever."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "发冷（寒战）", "simple": "身体发冷发抖", "def": "发烧前或发烧时，身体感到发冷、打寒战。", "ex": ["在温暖的地方也觉得身上发冷。", "冷得牙齿直打颤。", "发烧时又冷又抖。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "悪寒", "simple": "寒気がして震える", "def": "熱が上がる前や熱があるときに、体がぞくぞく寒く、震えることです。", "ex": ["暖かい場所にいても体がぞくぞくする。", "歯がガチガチ鳴るほど体が震える。", "熱が出て、寒気がして震えた。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "fatigue": {"ko": {"term": "전신 쇠약감", "simple": "온몸에 힘이 없음", "def": "특별한 이유 없이 온몸에 힘이 없고 쉽게 지치는 것을 말합니다.", "ex": ["푹 쉬어도 피곤함이 풀리지 않는다.", "조금만 움직여도 쉽게 지친다.", "몸에 힘이 없어 일상생활이 힘들다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "General weakness", "simple": "No energy in your whole body", "def": "Your whole body feels weak and you tire easily for no clear reason.", "ex": ["You still feel tired even after a good rest.", "You get worn out after moving only a little.", "You feel so weak that daily life is hard."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "全身乏力", "simple": "浑身没劲", "def": "没有特别原因，全身无力、容易疲劳。", "ex": ["好好休息了也还是觉得累。", "稍微活动一下就很容易累。", "身体没力气，日常生活都很吃力。"], "note": "", "act": "如果符合，请选择“有”。"}, "ja": {"term": "全身のだるさ", "simple": "体全体に力が入らない", "def": "特に理由がないのに、体全体に力が入らず、疲れやすいことです。", "ex": ["ゆっくり休んでも疲れがとれない。", "少し動いただけで疲れてしまう。", "体に力が入らず、日常生活がつらい。"], "note": "", "act": "当てはまる場合は「あり」を選んでください。"}}, "vomiting": {"ko": {"term": "구토", "simple": "먹은 것을 토함", "def": "위에 있던 음식이나 물이 입 밖으로 넘어오는 것을 말합니다.", "ex": ["먹은 음식을 토했다.", "물만 마셔도 토한다.", "하루에 여러 번 토했다."], "note": "토한 것에 피가 섞여 있었다면 ‘토혈’ 항목도 확인해 주세요.", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Vomiting", "simple": "Throwing up", "def": "Food or liquid from your stomach comes back up and out of your mouth.", "ex": ["You threw up food you had eaten.", "You throw up even when you drink only water.", "You threw up several times in one day."], "note": "If there was blood in it, also check ‘Vomiting blood’.", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "呕吐", "simple": "把吃的东西吐出来", "def": "胃里的食物或水从嘴里吐出来。", "ex": ["把吃下的食物吐了出来。", "只喝水也会吐。", "一天吐了好几次。"], "note": "如果吐出的东西里有血，请同时查看“呕血”。", "act": "如果符合，请选择“有”。"}, "ja": {"term": "嘔吐", "simple": "食べたものを吐く", "def": "胃の中の食べ物や水が、口から出てくることです。", "ex": ["食べたものを吐いた。", "水を飲むだけでも吐いてしまう。", "1日に何度も吐いた。"], "note": "吐いたものに血が混じっていた場合は「吐血」も確認してください。", "act": "当てはまる場合は「あり」を選んでください。"}}, "abdominalPain": {"ko": {"term": "복통", "simple": "배가 아픔", "def": "배 부위에 통증이나 불편한 느낌이 있는 것을 말합니다.", "ex": ["배가 쥐어짜듯 아프다.", "배가 콕콕 쑤시거나 더부룩하다.", "식사 전후로 배가 아프다."], "note": "아픈 곳이 배의 어느 쪽인지 손으로 가리켜 의료진에게 알려 주면 도움이 돼요.", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Abdominal pain", "simple": "Pain in your belly", "def": "Pain or discomfort in your belly.", "ex": ["Your belly hurts as if it is being squeezed.", "Your belly has sharp pains or feels bloated.", "Your belly hurts before or after meals."], "note": "It helps to point to where it hurts when you tell the staff.", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "腹痛", "simple": "肚子疼", "def": "腹部出现疼痛或不舒服的感觉。", "ex": ["肚子像被拧着一样疼。", "肚子一阵阵刺痛或发胀。", "饭前或饭后肚子疼。"], "note": "告诉医护人员时，用手指出疼痛的位置会很有帮助。", "act": "如果符合，请选择“有”。"}, "ja": {"term": "腹痛", "simple": "おなかが痛い", "def": "おなかに痛みや不快な感じがあることです。", "ex": ["おなかがしぼられるように痛い。", "おなかがチクチク痛む、または張っている。", "食事の前後におなかが痛む。"], "note": "おなかのどこが痛いか、手で指して医療スタッフに伝えると役立ちます。", "act": "当てはまる場合は「あり」を選んでください。"}}, "diarrhea": {"ko": {"term": "설사", "simple": "묽은 변을 자주 봄", "def": "평소보다 묽거나 물 같은 변을 자주 보는 것을 말합니다.", "ex": ["물 같은 변을 하루에 여러 번 본다.", "평소보다 변이 묽다.", "배가 아프면서 급하게 화장실에 간다."], "note": "", "act": "해당된다면 ‘있음’을 선택해주세요."}, "en": {"term": "Diarrhea", "simple": "Loose, watery stool", "def": "You pass loose or watery stool more often than usual.", "ex": ["You have watery stool several times a day.", "Your stool is looser than usual.", "You have belly pain and need to rush to the toilet."], "note": "", "act": "If this applies to you, choose ‘Yes’."}, "zh": {"term": "腹泻", "simple": "拉肚子", "def": "比平时更频繁地排出稀便或水样便。", "ex": ["一天拉 const HASH = String.fromCharCode(35);
const VOICE = {ko:"ko-KR",en:"en-US",zh:"zh-CN",ja:"ja-JP"};

let lang="ko", aud="general", current="palpitations", cat="all", query="", origin="sample", speaking=false, voices=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t=k=>UI[lang][k];
const T=k=>TERMS[k][lang];
const catOf=k=>CATS.find(c=>c.keys.includes(k));

const ICON_ALERT='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>';
const ICON_SOUND='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>';

function renderStatic(){
  document.documentElement.lang = lang==="zh"?"zh-CN":lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t(el.dataset.t);if(typeof v==="string")el.textContent=v});
  document.querySelectorAll("[data-t-label]").forEach(el=>el.setAttribute("aria-label",t(el.dataset.tLabel)));
  $("q").placeholder=t("ph");
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  $("aud-hint").textContent=t("hint")[aud]; $("aud-hint").hidden=!t("hint")[aud];
  $("flow").innerHTML=t("steps").map((s,i)=>`<div class="step"><span class="n">${i+1}</span><h3>${esc(s[0])}</h3><p>${esc(s[1])}</p></div>`).join("");
}

function renderTabs(){
  const tabs=[{id:"all"},...CATS];
  $("tabs").innerHTML=tabs.map(c=>`<button type="button" role="tab" data-cat="${c.id}" aria-selected="${c.id===cat}">${esc(c.id==="all"?t("all"):t("cats")[c.id])}</button>`).join("");
}

function matches(k,q){
  if(!q) return true;
  const n=s=>s.replace(/\s+/g,"").toLowerCase();
  const v=n(q);
  return ["ko","en","zh","ja"].some(l=>[TERMS[k][l].term,TERMS[k][l].simple].some(x=>n(x).includes(v)));
}
function visibleKeys(){
  const base = cat==="all" ? CATS.flatMap(c=>c.keys) : CATS.find(c=>c.id===cat).keys;
  return base.filter(k=>TERMS[k] && matches(k,query));
}

function renderTiles(){
  const keys=visibleKeys();
  $("count").textContent=keys.length;
  $("tiles").innerHTML = keys.length ? keys.map(k=>`<button type="button" class="tile" data-key="${k}" aria-current="${k===current}"><b>${URGENT.includes(k)?'<i class="dot" aria-hidden="true"></i>':""}${esc(T(k).term)}</b><span>${esc(T(k).simple)}</span></button>`).join("")
    : `<p class="empty">${esc(t("noMatch"))}</p>`;
}

function markHTML(e){
  if(!e.act) return "";
  if(e.kind==="write") return `<div class="mark"><h3>${esc(t("mark"))}</h3><div class="write" aria-hidden="true">${esc(e.sample)}</div><p>${esc(e.act)}</p></div>`;
  const opts=e.opts||t("opts");
  return `<div class="mark"><h3>${esc(t("mark"))}</h3>
    <div class="boxes" aria-hidden="true">${opts.map((o,i)=>`<span class="box${i===0?" on":""}"><i></i>${esc(o)}</span>`).join("")}</div>
    <p>${esc(e.act)}${e.opts?"":" "+esc(t("unsure"))}</p></div>`;
}

function renderCard(){
  stopVoice();
  const k=current, e=T(k), c=catOf(k);
  const label = origin==="qr" ? t("fromQR") : origin==="sample" ? t("sample") : "";
  $("card").innerHTML=`
    <div class="card-top">
      <div class="meta"><span class="pill-w">${esc(t("cats")[c.id])}</span>${label?`<span class="pill-w">${esc(label)}</span>`:""}</div>
      <p class="label">${esc(t("original"))}</p>
      <h2>${esc(e.term)}</h2>
      <p class="plain">${esc(e.simple)}</p>
      <button type="button" class="listen" id="listen">${ICON_SOUND}<span>${esc(t("listen"))}</span></button>
      <p class="voice-msg" id="voice-msg" hidden></p>
    </div>
    <div class="card-body">
      ${URGENT.includes(k)?`<div class="alert" role="alert">${ICON_ALERT}<span>${esc(t("urgent"))}</span></div>`:""}
      <div class="blk"><h3>${esc(t("meaning"))}</h3><p class="def">${esc(e.def)}</p></div>
      ${e.ex.length?`<div class="blk"><h3>${esc(t("examples"))}</h3><ol class="ex">${e.ex.map((x,i)=>`<li><span class="num">${i+1}</span><span>${esc(x)}</span></li>`).join("")}</ol></div>`:""}
      ${e.note?`<p class="note"><b>${esc(t("note"))}</b>${esc(e.note)}</p>`:""}
      ${markHTML(e)}
      <div class="blk"><h3>${esc(t("related"))}</h3><div class="related">${c.keys.filter(x=>x!==k&&TERMS[x]).map(x=>`<button type="button" data-key="${x}">${esc(T(x).term)}</button>`).join("")}</div></div>
    </div>`;
  $("listen").onclick=toggleVoice;
}

function open(k,how){
  if(!TERMS[k]) return;
  current=k; origin=how||"pick";
  try{history.replaceState(null,"",HASH+k)}catch(_){}
  renderCard(); renderTiles();
  if(how==="qr" || window.matchMedia("(max-width:920px)").matches) $("card").scrollIntoView({behavior:"smooth",block:"start"});
}

/* ---------- 음성: 언어별 목소리 선택, 기호 제거, 문장 단위로 끊어 읽기 ---------- */
function loadVoices(){ if("speechSynthesis" in window) voices=speechSynthesis.getVoices(); }
function pickVoice(){
  const code=VOICE[lang].toLowerCase(), norm=v=>v.lang.replace("_","-").toLowerCase();
  return voices.find(v=>norm(v)===code&&/google|natural|premium|enhanced/i.test(v.name))||voices.find(v=>norm(v)===code)||voices.find(v=>norm(v).startsWith(lang))||(lang==="zh"?voices.find(v=>/^(cmn|yue)/.test(norm(v))):null)||null;
}
function chunks(text){
  return text.replace(/[‘’“”「」"]/g,"").split(/\n+/).flatMap(s=>s.match(/[^.!?。！？]+[.!?。！？]?/g)||[s]).map(s=>s.trim()).filter(Boolean);
}
function setSpeaking(on){speaking=on;const b=$("listen");if(b)b.querySelector("span").textContent=on?t("stop"):t("listen")}
function stopVoice(){ if("speechSynthesis" in window) speechSynthesis.cancel(); setSpeaking(false); }
function toggleVoice(){
  if(speaking){stopVoice();return}
  const msg=$("voice-msg");msg.hidden=true;
  if(!("speechSynthesis" in window)){msg.textContent=t("noVoice");msg.hidden=false;return}
  if(!voices.length) loadVoices();
  const v=pickVoice();
  if(voices.length&&!v){msg.textContent=t("noLangVoice");msg.hidden=false;return}
  const e=T(current);
  const parts=chunks([e.term+".",e.simple+".",e.def,...(e.ex.length?[t("examples")+".",...e.ex]:[]),e.note,e.act].filter(Boolean).join("\n"));
  speechSynthesis.cancel();
  parts.forEach((p,i)=>{const u=new SpeechSynthesisUtterance(p);u.lang=VOICE[lang];if(v)u.voice=v;u.rate=aud==="senior"?0.8:0.95;
    if(i===0)u.onstart=()=>setSpeaking(true);
    if(i===parts.length-1)u.onend=()=>setSpeaking(false);
    u.onerror=ev=>{if(ev.error!=="canceled"&&ev.error!=="interrupted")setSpeaking(false)};
    speechSynthesis.speak(u)});
}

/* ---------- QR 카메라 ----------
   QR 내용은 "https://(사이트 주소)/" 뒤에 용어 이름(예: cough)을 붙인 형식. 주소 끝의 용어 이름만 읽기 때문에
   사이트 주소가 바뀌어도 같은 QR로 열립니다. 카메라 영상은 기기 안에서만 분석하고 저장하지 않습니다. */
let scanStream=null, scanTimer=0, detector=null, detectorChecked=false, lastNotice=0;
const qrCanvas=document.createElement("canvas");
const qrCtx=qrCanvas.getContext("2d",{willReadFrequently:true});

function keyFromQR(raw){
  const s=String(raw||"").trim();
  if(TERMS[s]) return s;
  let h="";
  try{const u=new URL(s,location.href); h=u.hash.slice(1)||u.searchParams.get("term")||"";}catch(_){}
  if(!h){const m=s.match(/\x23([A-Za-z]+)\s*$/); if(m) h=m[1];}
  try{h=decodeURIComponent(h)}catch(_){}
  return TERMS[h]?h:null;
}
function scanState(state,text){
  const live=state==="live";
  $("scan-frame").hidden=!live; $("scan-guide").hidden=!live;
  $("scan-panel").hidden=live; $("scan-panel-text").textContent=text||"";
}
function scanNotice(text){
  const m=$("scan-msg"); m.textContent=text; m.hidden=false;
  clearTimeout(scanNotice.tm); scanNotice.tm=setTimeout(()=>{m.hidden=true},3500);
}
async function getDetector(){
  if(detectorChecked) return detector;
  detectorChecked=true;
  if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes("qr_code"))detector=new BarcodeDetector({formats:["qr_code"]})}catch(_){}}
  return detector;
}
/* 문진표에는 QR이 여러 개 붙어 있어서, 화면 가운데 네모 안(조금 여유 포함)만 읽고
   그 안에서도 네모 중심에 가장 가까운 QR 하나를 고릅니다. */
function viewfinderRect(v){
  const vw=v.videoWidth, vh=v.videoHeight, vr=v.getBoundingClientRect(), fr=$("scan-frame").getBoundingClientRect();
  if(!vw||!vh||!fr.width) return {x:0,y:0,w:vw,h:vh};
  const sc=Math.max(vr.width/vw,vr.height/vh), ox=vr.left+(vr.width-vw*sc)/2, oy=vr.top+(vr.height-vh*sc)/2, pad=fr.width*0.1;
  let x=(fr.left-pad-ox)/sc, y=(fr.top-pad-oy)/sc, w=(fr.width+2*pad)/sc, h=(fr.height+2*pad)/sc;
  x=Math.max(0,x); y=Math.max(0,y); w=Math.min(vw-x,w); h=Math.min(vh-y,h);
  return {x,y,w,h};
}
async function decodeFrom(src,w,h,rect){
  rect=rect||{x:0,y:0,w:w,h:h};
  const d=await getDetector();
  if(d){
    try{
      const r=await d.detect(src);
      if(r&&r.length){
        const cx=rect.x+rect.w/2, cy=rect.y+rect.h/2;
        const inside=r.map(c=>{const b=c.boundingBox;return {c,mx:b.x+b.width/2,my:b.y+b.height/2}})
          .filter(o=>o.mx>=rect.x&&o.mx<=rect.x+rect.w&&o.my>=rect.y&&o.my<=rect.y+rect.h)
          .sort((a,b)=>((a.mx-cx)**2+(a.my-cy)**2)-((b.mx-cx)**2+(b.my-cy)**2));
        if(inside.length) return inside[0].c.rawValue;
      }
    }catch(_){}
  }
  if(!window.jsQR||!rect.w||!rect.h) return null;
  const scale=Math.min(1,960/Math.max(rect.w,rect.h)), cw=Math.max(1,Math.round(rect.w*scale)), ch=Math.max(1,Math.round(rect.h*scale));
  qrCanvas.width=cw; qrCanvas.height=ch; qrCtx.drawImage(src,rect.x,rect.y,rect.w,rect.h,0,0,cw,ch);
  const r=jsQR(qrCtx.getImageData(0,0,cw,ch).data,cw,ch,{inversionAttempts:"attemptBoth"});
  return r?r.data:null;
}
function useResult(raw){
  const k=keyFromQR(raw);
  if(!k) return false;
  try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}
  closeScanner(); open(k,"qr");
  return true;
}
async function openScanner(){
  stopVoice();
  $("scanner").hidden=false; document.documentElement.classList.add("scanning");
  $("scan-msg").hidden=true; scanState("wait",t("scanStarting"));
  $("scan-close").focus();
  if(!window.isSecureContext){scanState("error",t("scanInsecure"));return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanState("error",t("scanNoCam"));return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    if($("scanner").hidden){stream.getTracks().forEach(tr=>tr.stop());return}
    scanStream=stream;
    const v=$("scan-video"); v.srcObject=stream;
    try{await v.play()}catch(_){}
    scanState("live");
    tick();
  }catch(err){
    const denied=err&&(err.name==="NotAllowedError"||err.name==="SecurityError"||err.name==="PermissionDeniedError");
    let framed=false; try{framed=window.top!==window.self}catch(_){framed=true}
    scanState("error",denied?(framed?t("scanPreview"):t("scanDenied")):t("scanNoCam"));
  }
}
async function tick(){
  if(!scanStream) return;
  const v=$("scan-video");
  if(v.readyState>=2&&v.videoWidth){
    const raw=await decodeFrom(v,v.videoWidth,v.videoHeight,viewfinderRect(v));
    if(raw){
      if(useResult(raw)) return;
      if(Date.now()-lastNotice>3000){lastNotice=Date.now();scanNotice(t("scanUnknown"))}
    }
  }
  scanTimer=setTimeout(tick,160);
}
function closeScanner(){
  clearTimeout(scanTimer);
  if(scanStream){scanStream.getTracks().forEach(tr=>tr.stop());scanStream=null}
  $("scan-video").srcObject=null;
  $("scanner").hidden=true; document.documentElement.classList.remove("scanning");
}
async function readPhoto(file){
  let src,w,h;
  if(window.createImageBitmap){src=await createImageBitmap(file);w=src.width;h=src.height}
  else{src=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});w=src.naturalWidth;h=src.naturalHeight}
  return decodeFrom(src,w,h);
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",ev=>{
  const tile=ev.target.closest("[data-key]"); if(tile){open(tile.dataset.key,"pick");return}
  const tab=ev.target.closest("[data-cat]"); if(tab){cat=tab.dataset.cat;renderTabs();renderTiles();return}
  const lb=ev.target.closest("[data-lang]"); if(lb){lang=lb.dataset.lang;renderAll();return}
  const st=ev.target.closest("[data-start]"); if(st){chooseStart(st.dataset.start);return}
  const ab=ev.target.closest("[data-aud]"); if(ab){setAud(ab.dataset.aud);renderStatic();renderCard();}
});
$("scan-open").addEventListener("click",openScanner);
$("scan-close").addEventListener("click",()=>{closeScanner();$("scan-open").focus({preventScroll:true})});
$("scan-manual").addEventListener("click",()=>{closeScanner();$("q").focus();$("q").scrollIntoView({behavior:"smooth",block:"center"})});
$("scan-file").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  let raw=null; try{raw=await readPhoto(f)}catch(_){}
  if(raw&&useResult(raw)) return;
  scanNotice(raw?t("scanUnknown"):t("scanPhotoFail"));
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("scanner").hidden){closeScanner();$("scan-open").focus({preventScroll:true})}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&scanStream)closeScanner()});
$("q").addEventListener("input",e=>{query=e.target.value.trim();renderTiles()});
$("search-form").addEventListener("submit",e=>{e.preventDefault();query=$("q").value.trim();if(cat!=="all"&&!visibleKeys().length){cat="all";renderTabs()}renderTiles();const k=visibleKeys()[0];if(k)open(k,"pick")});
if("speechSynthesis" in window){loadVoices();speechSynthesis.addEventListener("voiceschanged",loadVoices)}
window.addEventListener("hashchange",()=>{const k=keyFromQR(location.href);if(k&&k!==current)open(k,"qr")});

function setAud(a){
  aud=a; document.querySelectorAll("[data-aud]").forEach(b=>b.setAttribute("aria-checked",String(b.dataset.aud===aud)));
  document.documentElement.classList.toggle("large",aud==="senior");
}
function chooseStart(a){
  setAud(a); renderStatic(); renderCard();
  $("start").hidden=true; document.documentElement.classList.remove("starting");
  if(origin==="qr"){$("card").scrollIntoView({block:"start"})} else {scrollTo(0,0)}
  $("scan-open").focus({preventScroll:true});
}
function renderAll(){renderStatic();renderTabs();renderTiles();renderCard()}
(function init(){const k=keyFromQR(location.href);if(k){current=k;origin="qr"}document.documentElement.classList.add("starting");renderAll()})();
</script>
